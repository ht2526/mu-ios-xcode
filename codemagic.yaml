workflows:
  ios-unsigned-sideloadly:
    name: MU iOS ARM64 - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 26.4
      vars:
        XCODE_PROJECT: "Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
        IOS_BUNDLE_ID: "com.htp.mu21"
    scripts:
      - name: Build verified xLua libraries for iOS ARM64
        script: |
          set -euo pipefail
          set -o pipefail
          export IOS_NATIVE_OUTPUT_DIR="$CM_BUILD_DIR/NativeGenerated"
          mkdir -p "$CM_BUILD_DIR/Build/iOS"
          bash "$CM_BUILD_DIR/Tools/iOSNative/build-ios-native.sh" \
            2>&1 | tee "$CM_BUILD_DIR/Build/iOS/ios-native-xlua-build.log"
          test -s "$IOS_NATIVE_OUTPUT_DIR/libxlua.a"
          test -s "$IOS_NATIVE_OUTPUT_DIR/libmu_xlua_extensions.a"
          test -s "$IOS_NATIVE_OUTPUT_DIR/liblegacy_native_bridge.a"

      - name: Prepare legacy proprietary native bridge
        script: |
          set -euo pipefail
          set -o pipefail
          source_binary="$CM_BUILD_DIR/Tools/iOSNative/legacy/LegacyNative"
          source_plist="$CM_BUILD_DIR/Tools/iOSNative/legacy/Info.plist"
          bridge="$CM_BUILD_DIR/NativeGenerated/LegacyNative.framework"
          log="$CM_BUILD_DIR/Build/iOS/ios-native-legacy-bridge.log"

          {
            test -s "$source_binary"
            test -s "$source_plist"
            rm -rf "$bridge"
            mkdir -p "$bridge"
            ditto "$source_binary" "$bridge/LegacyNative"
            ditto "$source_plist" "$bridge/Info.plist"
            chmod 755 "$bridge/LegacyNative"
            codesign --remove-signature "$bridge/LegacyNative" 2>/dev/null || true
            install_name_tool \
              -id "@rpath/LegacyNative.framework/LegacyNative" \
              "$bridge/LegacyNative"

            file "$bridge/LegacyNative"
            lipo "$bridge/LegacyNative" -verify_arch arm64
            otool -D "$bridge/LegacyNative"
            nm -gU "$bridge/LegacyNative" > "$CM_BUILD_DIR/NativeGenerated/legacy-native-symbols.txt"

            for symbol in \
              _nav_create_scene \
              _tile_init_scene \
              _cpp_read_asset \
              _rectpack_create \
              _sensitive_censor; do
              grep -q "[[:space:]]${symbol}$" \
                "$CM_BUILD_DIR/NativeGenerated/legacy-native-symbols.txt"
            done
          } 2>&1 | tee "$log"

      - name: Verify exported Unity Xcode project
        script: |
          set -euo pipefail
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -showBuildSettings \
            > "$CM_BUILD_DIR/xcode-build-settings.txt"

      - name: Verify HybridCLR native runtime
        script: |
          set -euo pipefail
          bash "$CM_BUILD_DIR/Tools/Codemagic/verify-hybridclr-xcode.sh"

      - name: Prepare 77 MB bootstrap payload
        script: |
          set -euo pipefail
          bash "$CM_BUILD_DIR/Tools/Codemagic/prepare-bootstrap-payload.sh"

      - name: Build unsigned ARM64 device archive
        script: |
          set -euo pipefail
          set -o pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild archive \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/MU.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            "GCC_PREPROCESSOR_DEFINITIONS=\$(inherited) FORCE_PINVOKE_nav_INTERNAL=1 FORCE_PINVOKE_gamecppDll_INTERNAL=1 FORCE_PINVOKE_xlua_INTERNAL=1" \
            "LIBRARY_SEARCH_PATHS=$CM_BUILD_DIR/NativeGenerated \$(inherited)" \
            "FRAMEWORK_SEARCH_PATHS=$CM_BUILD_DIR/NativeGenerated \$(inherited)" \
            "OTHER_LDFLAGS=\$(inherited) -force_load $CM_BUILD_DIR/NativeGenerated/libxlua.a -force_load $CM_BUILD_DIR/NativeGenerated/libmu_xlua_extensions.a -force_load $CM_BUILD_DIR/NativeGenerated/liblegacy_native_bridge.a" \
            2>&1 | tee "$CM_BUILD_DIR/build/xcodebuild.log"

      - name: Verify archived HybridCLR runtime
        script: |
          set -euo pipefail
          bash "$CM_BUILD_DIR/Tools/Codemagic/verify-hybridclr-xcode.sh" \
            "$CM_BUILD_DIR/build/MU.xcarchive"

      - name: Package unsigned IPA for Sideloadly
        script: |
          set -euo pipefail
          app_path="$(find "$CM_BUILD_DIR/build/MU.xcarchive/Products/Applications" \
            -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p "$app_path/Frameworks"
          ditto \
            "$CM_BUILD_DIR/NativeGenerated/LegacyNative.framework" \
            "$app_path/Frameworks/LegacyNative.framework"
          mkdir -p "$CM_BUILD_DIR/build/Payload"
          ditto "$app_path" "$CM_BUILD_DIR/build/Payload/$(basename "$app_path")"
          cd "$CM_BUILD_DIR/build"
          /usr/bin/zip -qry "MU-unsigned-arm64.ipa" Payload
          test -s "$CM_BUILD_DIR/build/MU-unsigned-arm64.ipa"
    artifacts:
      - build/MU-unsigned-arm64.ipa
      - build/xcodebuild.log
      - Build/iOS/ios-native-xlua-build.log
      - Build/iOS/ios-native-xlua-summary.txt
      - Build/iOS/ios-native-legacy-bridge.log
      - Build/iOS/hybridclr-verification.txt
      - Build/bootstrap-payload-report.txt
      - NativeGenerated/legacy-native-symbols.txt
      - xcode-build-settings.txt
      - unresolved-ios-dependencies.txt
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
